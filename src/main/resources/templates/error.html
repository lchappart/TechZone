<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur - TechZone</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <div class="card" style="max-width: 600px; margin: 4rem auto; text-align: center;">
            <div class="card-body">
                <h1 style="font-size: 4rem; color: var(--danger-color); margin-bottom: 1rem;">⚠️</h1>
                <h2 style="margin-bottom: 1rem;">Une erreur s'est produite</h2>
                <p th:text="${error ?: 'Une erreur inattendue s'est produite.'}" style="color: var(--text-secondary); margin-bottom: 2rem;"></p>
                <a th:href="@{/}" class="btn btn-primary">Retour à l'accueil</a>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Panier - TechZone</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <h1 style="margin-bottom: 2rem;">Mon Panier</h1>
        
        <div th:if="${cartItems != null && !cartItems.isEmpty()}" class="card">
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Prix unitaire</th>
                            <th>Quantité</th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <strong th:text="${item.productName}"></strong>
                                <span th:if="${!item.inStock}" class="status-rupture" style="display: inline-block; margin-left: 0.5rem;">
                                    🔴 Rupture
                                </span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(item.prix, 0, 2)} + ' €'"></td>
                            <td>
                                <input type="number" 
                                       th:id="'qty-' + ${item.productId}"
                                       th:value="${item.quantity}" 
                                       min="1" 
                                       class="form-control" 
                                       style="width: 80px; display: inline-block;"
                                       onchange="updateQuantity([[${item.productId}]], this.value)">
                            </td>
                            <td th:text="${#numbers.formatDecimal(item.total, 0, 2)} + ' €'"></td>
                            <td>
                                <button class="btn btn-danger btn-sm" 
                                        th:onclick="'removeFromCart(' + ${item.productId} + ')'">
                                    Supprimer
                                </button>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" style="text-align: right; font-weight: bold;">Total:</td>
                            <td style="font-weight: bold; font-size: 1.25rem; color: var(--primary-color);" 
                                th:text="${#numbers.formatDecimal(total, 0, 2)} + ' €'"></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="card-footer">
                <div class="flex-between">
                    <a th:href="@{/products}" class="btn btn-outline">Continuer les achats</a>
                    <form th:action="@{/cart/checkout}" method="post" sec:authorize="isAuthenticated()">
                        <button type="submit" class="btn btn-primary">Passer la commande</button>
                    </form>
                    <a th:href="@{/login}" sec:authorize="!isAuthenticated()" class="btn btn-primary">
                        Se connecter pour commander
                    </a>
                </div>
            </div>
        </div>
        
        <div th:if="${cartItems == null || cartItems.isEmpty()}" class="card">
            <div class="card-body text-center">
                <h2 style="margin-bottom: 1rem;">Votre panier est vide</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Ajoutez des produits à votre panier pour commencer vos achats.</p>
                <a th:href="@{/products}" class="btn btn-primary">Découvrir le catalogue</a>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script>
        function updateQuantity(productId, quantity) {
            fetch(`/api/cart/update?productId=${productId}&quantity=${quantity}`, {
                method: 'PUT',
                credentials: 'include'
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    showToast('Erreur lors de la mise à jour de la quantité', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('Erreur lors de la mise à jour de la quantité', 'error');
            });
        }
        
        function removeFromCart(productId) {
            showConfirm({
                title: 'Retirer du panier',
                message: 'Êtes-vous sûr de vouloir retirer ce produit du panier ?',
                confirmLabel: 'Retirer',
                cancelLabel: 'Annuler',
                danger: true
            }).then(ok => {
                if (!ok) return;
                fetch(`/api/cart/remove/${productId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        showToast('Erreur lors de la suppression du produit', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showToast('Erreur lors de la suppression du produit', 'error');
                });
            });
        }
    </script>
</body>
</html>

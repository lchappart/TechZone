<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.nom + ' - TechZone'}">Détail Produit</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;" class="card">
            <div class="product-image product-image-detail" style="height: 400px; border-radius: var(--radius-lg);">
                <img th:src="${product.imageUrl}" th:alt="${product.nom}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                     loading="lazy">
                <span class="product-image-fallback" style="display: none; font-size: 6rem;" th:text="${product.categoryName.charAt(0)}"></span>
            </div>
            <div style="padding: 2rem;">
                <h1 th:text="${product.nom}" style="margin-bottom: 1rem;"></h1>
                <div style="margin-bottom: 1rem;">
                    <span class="product-price" 
                          th:classappend="${product.promotion} ? 'promotion' : ''"
                          style="font-size: 2rem;"
                          th:text="${#numbers.formatDecimal(product.prix, 0, 2)} + ' €'"></span>
                    <span th:if="${product.promotion}" class="promotion-badge">PROMO</span>
                </div>
                <div class="product-status" 
                     th:classappend="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'} ? 'status-in-stock' : 'status-rupture'"
                     style="margin-bottom: 1.5rem;">
                    <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'}">🟢</span>
                    <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'RUPTURE'}">🔴</span>
                    <span th:text="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'} ? 'En stock' : 'Rupture de stock'"></span>
                </div>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;" th:text="${product.description}"></p>
                <div style="margin-bottom: 1.5rem;">
                    <label class="form-label">Quantité</label>
                    <input type="number" id="quantity" value="1" min="1" class="form-control" style="width: 100px;">
                </div>
                <button class="btn btn-primary" 
                        style="width: 100%;"
                        th:disabled="${product.stockStatus != null and product.stockStatus.name() == 'RUPTURE'}"
                        th:onclick="'addToCart(' + ${product.id} + ')'">
                    <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'}">Ajouter au panier</span>
                    <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'RUPTURE'}">Produit en rupture</span>
                </button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2>Informations produit</h2>
            </div>
            <div class="card-body">
                <p><strong>Catégorie:</strong> <span th:text="${product.categoryName}"></span></p>
                <p><strong>Prix:</strong> <span th:text="${#numbers.formatDecimal(product.prix, 0, 2)} + ' €'"></span></p>
                <p><strong>Statut:</strong> 
                    <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'}">🟢 En stock</span>
                    <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'RUPTURE'}">🔴 Rupture de stock</span>
                </p>
                <p th:if="${product.promotion}"><strong>Promotion:</strong> <span class="promotion-badge">Oui</span></p>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script>
        function addToCart(productId) {
            const quantity = parseInt(document.getElementById('quantity').value);
            fetch(`/api/cart/add?productId=${productId}&quantity=${quantity}`, {
                method: 'POST',
                credentials: 'include'
            })
            .then(response => {
                if (response.ok) {
                    showToast('Produit ajouté au panier !', 'success');
                } else {
                    response.json().then(data => showToast('Erreur: ' + (data.message || 'Impossible d\'ajouter au panier'), 'error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('Erreur lors de l\'ajout au panier', 'error');
            });
        }
    </script>
</body>
</html>

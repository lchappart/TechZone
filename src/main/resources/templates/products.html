<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Catalogue - TechZone</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <h1 style="margin-bottom: 2rem;">Catalogue Produits</h1>
        
        <div class="filters">
            <form method="get" action="/products" id="filter-form">
                <div class="filters-grid">
                    <div class="form-group">
                        <label class="form-label">Catégorie</label>
                        <select name="categoryId" class="form-select" onchange="document.getElementById('filter-form').submit();">
                            <option value="">Toutes les catégories</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.nom}"
                                    th:selected="${categoryId == cat.id}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Statut</label>
                        <select name="stockStatus" class="form-select" onchange="document.getElementById('filter-form').submit();">
                            <option value="">Tous</option>
                            <option value="EN_STOCK" th:selected="${stockStatus == 'EN_STOCK'}">En stock</option>
                            <option value="RUPTURE" th:selected="${stockStatus == 'RUPTURE'}">Rupture</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" name="promotion" value="true" 
                                   th:checked="${promotion == true}"
                                   onchange="document.getElementById('filter-form').submit();">
                            En promotion uniquement
                        </label>
                    </div>
                </div>
            </form>
        </div>
        
        <div class="products-grid" th:if="${products.totalElements > 0}">
            <div class="product-card" th:each="product : ${products.content}">
                <div class="product-image">
                    <img th:src="${product.imageUrl}" th:alt="${product.nom}" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                         loading="lazy">
                    <span class="product-image-fallback" style="display: none;" th:text="${product.categoryName.charAt(0)}"></span>
                </div>
                <div class="product-info">
                    <h3 class="product-name" th:text="${product.nom}"></h3>
                    <p class="product-description" th:text="${product.description}"></p>
                    <div>
                        <span class="product-price" 
                              th:classappend="${product.promotion} ? 'promotion' : ''"
                              th:text="${#numbers.formatDecimal(product.prix, 0, 2)} + ' €'"></span>
                        <span th:if="${product.promotion}" class="promotion-badge">PROMO</span>
                    </div>
                    <div class="product-status" 
                         th:classappend="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'} ? 'status-in-stock' : 'status-rupture'">
                        <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'}">🟢</span>
                        <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'RUPTURE'}">🔴</span>
                        <span th:text="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'} ? 'En stock' : 'Rupture'"></span>
                    </div>
                    <a th:href="@{'/product/' + ${product.id}}" class="btn btn-primary" style="width: 100%; margin-top: auto;">
                        Voir les détails
                    </a>
                </div>
            </div>
        </div>
        
        <div th:if="${products.totalElements == 0}" class="card">
            <div class="card-body text-center">
                <p>Aucun produit trouvé.</p>
            </div>
        </div>
        
        <div class="pagination" th:if="${products.totalPages > 1}">
            <a th:if="${currentPage > 0}" 
               th:href="@{/products(page=${currentPage - 1}, categoryId=${categoryId}, promotion=${promotion}, stockStatus=${stockStatus})}">
                Précédent
            </a>
            <span th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                  th:if="${i == currentPage || i == 0 || i == products.totalPages - 1 || (i >= currentPage - 2 && i <= currentPage + 2)}">
                <a th:if="${i != currentPage}"
                   th:href="@{/products(page=${i}, categoryId=${categoryId}, promotion=${promotion}, stockStatus=${stockStatus})}"
                   th:text="${i + 1}"></a>
                <span th:if="${i == currentPage}" 
                      class="active"
                      th:text="${i + 1}"></span>
            </span>
            <a th:if="${currentPage < products.totalPages - 1}"
               th:href="@{/products(page=${currentPage + 1}, categoryId=${categoryId}, promotion=${promotion}, stockStatus=${stockStatus})}">
                Suivant
            </a>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

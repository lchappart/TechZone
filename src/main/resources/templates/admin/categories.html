<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Gestion Catégories - TechZone</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <div class="flex-between" style="margin-bottom: 2rem;">
            <h1>Gestion des Catégories</h1>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline">Retour au dashboard</a>
        </div>
        
        <div class="card" style="margin-bottom: 2rem;">
            <div class="card-header">
                <h2>Ajouter une catégorie</h2>
            </div>
            <div class="card-body">
                <form id="category-form" onsubmit="createCategory(event)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Nom</label>
                            <input type="text" id="category-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <input type="text" id="category-description" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Créer la catégorie</button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2>Liste des catégories</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="category : ${categories}">
                            <td th:text="${category.id}"></td>
                            <td th:text="${category.nom}"></td>
                            <td th:text="${category.description}"></td>
                            <td>
                                <button class="btn btn-sm btn-danger" 
                                        th:onclick="'deleteCategory(' + ${category.id} + ')'">Supprimer</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script>
        function createCategory(event) {
            event.preventDefault();
            
            const category = {
                nom: document.getElementById('category-name').value,
                description: document.getElementById('category-description').value
            };
            
            fetch('/api/admin/categories', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(category)
            })
            .then(response => {
                if (response.ok) {
                    showToast('Catégorie créée avec succès', 'success');
                    setTimeout(() => location.reload(), 800);
                } else {
                    response.json().then(data => showToast('Erreur: ' + (data.message || 'Impossible de créer la catégorie'), 'error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('Erreur lors de la création de la catégorie', 'error');
            });
        }
        
        function deleteCategory(id) {
            showConfirm({
                title: 'Supprimer la catégorie',
                message: 'Êtes-vous sûr de vouloir supprimer cette catégorie ?',
                confirmLabel: 'Supprimer',
                cancelLabel: 'Annuler',
                danger: true
            }).then(ok => {
                if (!ok) return;
                fetch(`/api/admin/categories/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                .then(response => {
                    if (response.ok) {
                        showToast('Catégorie supprimée avec succès', 'success');
                        setTimeout(() => location.reload(), 800);
                    } else {
                        response.json().then(data => showToast('Erreur: ' + (data.message || 'Impossible de supprimer la catégorie'), 'error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showToast('Erreur lors de la suppression', 'error');
                });
            });
        }
    </script>
</body>
</html>

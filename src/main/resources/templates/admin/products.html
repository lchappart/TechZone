<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Gestion Produits - TechZone</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <div class="flex-between" style="margin-bottom: 2rem;">
            <h1>Gestion des Produits</h1>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline">Retour au dashboard</a>
        </div>
        
        <div class="card" style="margin-bottom: 2rem;">
            <div class="card-header">
                <h2>Ajouter un produit</h2>
            </div>
            <div class="card-body">
                <form id="product-form" onsubmit="createProduct(event)">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Nom</label>
                            <input type="text" id="product-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Prix</label>
                            <input type="number" id="product-price" step="0.01" min="0.01" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Catégorie</label>
                            <select id="product-category" class="form-select" required>
                                <option value="">Sélectionner une catégorie</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.nom}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Statut stock</label>
                            <select id="product-stock" class="form-select" required>
                                <option value="EN_STOCK">En stock</option>
                                <option value="RUPTURE">Rupture</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="product-promotion"> En promotion
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="product-description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL image (Pixabay ou autre)</label>
                        <input type="url" id="product-image-url" class="form-control" placeholder="https://cdn.pixabay.com/photo/...">
                        <small style="color: var(--text-muted); font-size: 0.8125rem;">Optionnel. Sinon une image par défaut selon la catégorie sera utilisée.</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Créer le produit</button>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2>Liste des produits</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prix</th>
                            <th>Catégorie</th>
                            <th>Stock</th>
                            <th>Promo</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products.content}">
                            <td th:text="${product.id}"></td>
                            <td th:text="${product.nom}"></td>
                            <td th:text="${#numbers.formatDecimal(product.prix, 0, 2)} + ' €'"></td>
                            <td th:text="${product.categoryName}"></td>
                            <td>
                                <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'EN_STOCK'}" 
                                      class="status-in-stock">🟢 En stock</span>
                                <span th:if="${product.stockStatus != null and product.stockStatus.name() == 'RUPTURE'}" 
                                      class="status-rupture">🔴 Rupture</span>
                            </td>
                            <td th:text="${product.promotion ? 'Oui' : 'Non'}"></td>
                            <td>
                                <button class="btn btn-sm btn-danger" 
                                        th:onclick="'deleteProduct(' + ${product.id} + ')'">Supprimer</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="pagination" th:if="${products.totalPages > 1}">
            <a th:if="${currentPage > 0}" th:href="@{/admin/products(page=${currentPage - 1})}">Précédent</a>
            <span th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                  th:if="${i == currentPage || i == 0 || i == products.totalPages - 1 || (i >= currentPage - 2 && i <= currentPage + 2)}">
                <a th:if="${i != currentPage}" th:href="@{/admin/products(page=${i})}" th:text="${i + 1}"></a>
                <span th:if="${i == currentPage}" class="active" th:text="${i + 1}"></span>
            </span>
            <a th:if="${currentPage < products.totalPages - 1}" th:href="@{/admin/products(page=${currentPage + 1})}">Suivant</a>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script>
        function createProduct(event) {
            event.preventDefault();
            
            const imageUrlEl = document.getElementById('product-image-url');
            const product = {
                nom: document.getElementById('product-name').value,
                description: document.getElementById('product-description').value,
                prix: parseFloat(document.getElementById('product-price').value),
                categoryId: parseInt(document.getElementById('product-category').value),
                stockStatus: document.getElementById('product-stock').value,
                promotion: document.getElementById('product-promotion').checked,
                imageUrl: imageUrlEl && imageUrlEl.value.trim() ? imageUrlEl.value.trim() : null
            };
            
            fetch('/api/admin/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(product)
            })
            .then(response => {
                if (response.ok) {
                    showToast('Produit créé avec succès', 'success');
                    setTimeout(() => location.reload(), 800);
                } else {
                    response.json().then(data => showToast('Erreur: ' + (data.message || 'Impossible de créer le produit'), 'error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('Erreur lors de la création du produit', 'error');
            });
        }
        
        function deleteProduct(id) {
            showConfirm({
                title: 'Supprimer le produit',
                message: 'Êtes-vous sûr de vouloir supprimer ce produit ?',
                confirmLabel: 'Supprimer',
                cancelLabel: 'Annuler',
                danger: true
            }).then(ok => {
                if (!ok) return;
                fetch(`/api/admin/products/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                .then(response => {
                    if (response.ok) {
                        showToast('Produit supprimé avec succès', 'success');
                        setTimeout(() => location.reload(), 800);
                    } else {
                        showToast('Erreur lors de la suppression', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showToast('Erreur lors de la suppression', 'error');
                });
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Détail Commande - TechZone</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <div class="flex-between" style="margin-bottom: 2rem;">
            <h1>Commande #<span th:text="${order.id}"></span></h1>
            <a th:href="@{/admin/orders}" class="btn btn-outline">Retour aux commandes</a>
        </div>
        
        <div class="card" style="margin-bottom: 2rem;">
            <div class="card-header">
                <h2>Informations de la commande</h2>
            </div>
            <div class="card-body">
                <p><strong>Date:</strong> <span th:text="${#temporals.format(order.date, 'dd/MM/yyyy à HH:mm')}"></span></p>
                <p><strong>Client:</strong> <span th:text="${order.userEmail}"></span></p>
                <p><strong>Total:</strong> <span style="font-size: 1.5rem; font-weight: bold; color: var(--primary-color);" 
                                                 th:text="${#numbers.formatDecimal(order.total, 0, 2)} + ' €'"></span></p>
                <div class="form-group" style="margin-top: 1rem;">
                    <label class="form-label">Modifier le statut</label>
                    <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post">
                        <select name="status" class="form-select" style="width: auto; display: inline-block; margin-right: 1rem;">
                            <option th:each="status : ${T(com.techzone.entity.Order.OrderStatus).values()}" 
                                    th:value="${status.name()}" 
                                    th:text="${status}"
                                    th:selected="${order.statut != null and order.statut.name() == status.name()}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary">Mettre à jour</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2>Articles commandés</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Produit</th>
                            <th>Prix unitaire</th>
                            <th>Quantité</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="line : ${order.orderLines}">
                            <td th:text="${line.productName}"></td>
                            <td th:text="${#numbers.formatDecimal(line.prixUnitaire, 0, 2)} + ' €'"></td>
                            <td th:text="${line.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(line.prixUnitaire * line.quantity, 0, 2)} + ' €'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
